# Prompt inicial de BAIXA QUALIDADE, obtido do LangSmith Prompt Hub com
#   python src/pull_prompts.py   (fonte: leonanluppi/bug_to_user_story_v1)
# Problemas intencionais: {bug_report} duplicado no system e no user prompt,
# instruções vagas, falta de exemplos, sem persona definida e sem formato de saída.
# A versão otimizada está em prompts/bug_to_user_story_v2.yml.

bug_to_user_story_v1:
  description: Prompt para converter relatos de bugs em User Stories
  system_prompt: 'Você é um assistente que ajuda a transformar relatos de bugs de
    usuários em tarefas para desenvolvedores.


    Analise o relato de bug abaixo e crie uma user story a partir dele.


    Relato de Bug:

    ---

    {bug_report}

    ---


    User Story gerada:

    '
  user_prompt: '{bug_report}'
  input_variables:
  - bug_report
  source: leonanluppi/bug_to_user_story_v1
  version: v1
  pulled_at: '2026-11-12'
  tags:
  - bug-analysis
  - user-story
  - product-management
