  techniques_details:
    role_prompting: "Persona de Product Manager sênior especialista em BDD, segurança, performance e UX."
    few_shot_learning: "4 exemplos sintéticos de entrada/saída (simples, médio com contexto técnico, médio de segurança, médio de performance com metas mensuráveis)."
    chain_of_thought: "Raciocínio passo a passo interno (persona → ação → benefício → critérios → dados → complexidade), sem expor o raciocínio na resposta."
    skeleton_of_thought: "Esqueletos de saída explícitos por nível de complexidade (simples, médio, complexo)."
